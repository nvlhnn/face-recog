version: '3.8'

services:
  face-api:
    build: .
    container_name: api-face-recog
    restart: unless-stopped
    environment:
      - ENV=production
      - ACCESS_TOKEN=${ACCESS_TOKEN:-}
      - FACE_TOLERANCE=0.363
    volumes:
      - ./data:/app/data
    labels:
      # Traefik configuration
      - "traefik.enable=true"
      - "traefik.http.routers.face-recog.rule=Host(`face-api.dev-1.jarivis.com`)"
      - "traefik.http.routers.face-recog.entrypoints=web"
      - "traefik.http.services.face-recog.loadbalancer.server.port=5000"
    networks:
      - reverse-proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  reverse-proxy:
    external: true
