version: '3.8'

services:
  face-api:
    build: .
    container_name: api-face-recog
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - ENV=production
      - GUNICORN_WORKERS=1
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    labels:
      # Traefik configuration
      - "traefik.enable=true"
      - "traefik.http.routers.face-recog.rule=Host(`face-api.dev-1.jarivis.com`)"
      - "traefik.http.routers.face-recog.entrypoints=web"
      - "traefik.http.services.face-recog.loadbalancer.server.port=5000"
    networks:
      - reverse-proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  reverse-proxy:
    external: true
