services:
  face-api:
    build: .
    container_name: api-face-recog
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - ENV=production
      - GUNICORN_WORKERS=1
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
