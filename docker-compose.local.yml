version: '3.8'

# Local development - no Traefik needed
services:
  face-api:
    build: .
    container_name: face-recog-local
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env.staging
    environment:
      - ENV=staging  # Tells the app which environment it is
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
